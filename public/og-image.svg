<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Subtle ambient glow rings -->
  <circle cx="1050" cy="120" r="280" fill="#4F46E5" opacity="0.12" filter="blur(60px)" />
  <circle cx="150" cy="520" r="220" fill="#7C3AED" opacity="0.10" filter="blur(50px)" />

  <!-- Outer frame border -->
  <rect x="30" y="30" width="1140" height="570" rx="24" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- App Badge & Header -->
  <g transform="translate(100, 100)">
    <rect width="64" height="64" rx="18" fill="url(#logoGrad)" />
    <!-- Sparkles motif -->
    <path d="M32 15L34.5 27.5L47 30L34.5 32.5L32 45L29.5 32.5L17 30L29.5 27.5L32 15Z" fill="#FFFFFF" />
    <path d="M46 13L47.2 18.8L53 20L47.2 21.2L46 27L44.8 21.2L39 20L44.8 18.8L46 13Z" fill="#E0E7FF" opacity="0.9" />

    <text x="84" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">Ideate</text>
    <rect x="206" y="22" width="220" height="28" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <circle cx="222" cy="36" r="4" fill="#6366F1" />
    <text x="234" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#CBD5E1" letter-spacing="0.5">PROBLEM-SOLVING EXPERIENCE</text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(100, 240)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="900" fill="url(#textGrad)" letter-spacing="-1.5">
      Turn everyday problems into
    </text>
    <text y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="900" fill="#A5B4FC" letter-spacing="-1.5">
      possible technology product ideas.
    </text>
    <text y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#94A3B8">
      An interactive 4-stage workshop experience for technology events and creative thinkers.
    </text>
  </g>

  <!-- 4 Stages Pills -->
  <g transform="translate(100, 470)">
    <!-- Stage 1 -->
    <g transform="translate(0, 0)">
      <rect width="230" height="52" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#818CF8">STAGE 1</text>
      <text x="18" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#F1F5F9">Choose a problem</text>
    </g>

    <!-- Stage 2 -->
    <g transform="translate(250, 0)">
      <rect width="230" height="52" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#818CF8">STAGE 2</text>
      <text x="18" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#F1F5F9">Understand context</text>
    </g>

    <!-- Stage 3 -->
    <g transform="translate(500, 0)">
      <rect width="230" height="52" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#818CF8">STAGE 3</text>
      <text x="18" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#F1F5F9">Explore a solution</text>
    </g>

    <!-- Stage 4 -->
    <g transform="translate(750, 0)">
      <rect width="230" height="52" rx="14" fill="#312E81" stroke="#4F46E5" stroke-width="1" />
      <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#A5B4FC">STAGE 4</text>
      <text x="18" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Your product concept</text>
    </g>
  </g>
</svg>
